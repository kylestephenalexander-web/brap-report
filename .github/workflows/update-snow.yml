name: Update snow data

on:
  schedule:
    # Runs at 15 minutes past every hour (UTC)
    - cron: "15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch latest SNOTEL data
        run: python scripts/fetch_snow.py

      - name: Commit and push if changed
        run: |
          git config user.name "snow-bot"
          git config user.email "snow-bot@users.noreply.github.com"
          git add data.json
          git diff --quiet --cached || git commit -m "Update snow data"
          git push
